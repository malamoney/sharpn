# Serves the Console's build and proxies `/api/` to the Console API. Baked
# into the Console's image (./Dockerfile); TLS material is mounted at run
# time by docker-compose.yml, not referenced by path assumption alone — see
# docs/deployment.md for how `./certs` gets there (`mkcert`).
#
# Two things this file exists to get right, both explained where they bite:
#
# - The timeout ladder below. One `proxy_read_timeout` for every `/api/`
#   route would either close `/api/v1/events` on every idle SSE gap under
#   fifteen seconds, or let a hung Command hold a worker for seventy-five —
#   ADR 0001 and ADR 0002's "Invalidation" is why the Console needs the event
#   stream to survive a quiet Bridge in the first place.
# - `proxy_pass` with no path after the upstream, in every `/api/` location.
#   The Console API's own routes are mounted at `/api/v1/...` (server.ts) and
#   expect the full path; a `proxy_pass` with a trailing `/api/` would strip
#   the prefix this proxy matched on and send `/v1/...` instead, which the
#   Console API has no route for.

upstream console_api {
  server console-api:3000;
}

server {
  listen 80;
  server_name _;
  # Nothing here has a Console-API-typed secret in it, but the session
  # cookie is `Secure` (http/session.ts) and would never be sent back over
  # this — so a redirect, not a service, is what a plain-HTTP request gets.
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name _;

  ssl_certificate     /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  # Matched by nginx's `=` exact-match rule ahead of the `/api/` prefix below
  # regardless of file order, which is what lets this location carry its own
  # timeout and buffering without a second copy of the `/api/` block.
  location = /api/v1/events {
    proxy_pass http://console_api;
    proxy_http_version 1.1;

    # $host, not $proxy_host: the Console API's CSRF check compares the
    # `Origin` header's host against the `Host` header it received
    # (app.ts's `csrfGuard`), and both have to be the host a browser actually
    # dialled for that comparison to ever pass.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # An SSE connection is meant to sit open; fifteen seconds would close it
    # on every heartbeat-sized gap (events.ts's `HEARTBEAT_INTERVAL_MS`).
    proxy_read_timeout 75s;
    # Buffering would hold every frame until this buffer filled rather than
    # forwarding each as the Console API writes it — the Console API sets
    # `X-Accel-Buffering: no` on this same response as belt-and-braces, but
    # this is the setting that actually does it.
    proxy_buffering off;
    proxy_cache off;
  }

  location /api/ {
    proxy_pass http://console_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Every other route the Console API answers is a bounded request-reply;
    # fifteen seconds is generous for one and does not hold a worker on a
    # Bridge that never answers.
    proxy_read_timeout 15s;
  }

  # Anything under `/api/` that reaches here falls through to the Console
  # API's own catch-all (`app.ts`'s `unservedPath`), which answers in the same
  # JSON envelope every other error does — deliberately a 400, not a 404
  # (app.ts explains why) — never `try_files` below, which would hand an
  # unknown API path a browser's own `index.html` and call it a 200.
  location / {
    try_files $uri /index.html;
  }
}
